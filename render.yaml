services:
  - type: web
    name: blinkit-auto-server
    env: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/server/index.js
    plan: free
    envVars:
      - key: PORT
        value: 3000
      # IMPORTANT: SQLite data will not persist across restarts on the Free tier.
      # This is only for temporary test deployments.
      - key: DATABASE_PATH
        value: /tmp/blinkit_auto.sqlite3
      - key: TELEGRAM_BOT_TOKEN
        sync: false
